providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
    
# Helm creates GatewayClass 'traefik' and Gateway 'traefik-gateway' here.
gateway:
  enabled: false

gatewayClass:
  enabled: true
  name: traefik

# k3s ServiceLB exposes the LoadBalancer service on the EC2 public IP:80.
service:
  spec:
    type: LoadBalancer
    
ports:
  web:
    port: 80
    exposedPort: 80
    asDefault: true
    expose:
      external: true
    allowACMEByPass: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
          
  websecure:
    exposedPort: 443
    port: 443
    expose:
      external: true
    #  default: true

