---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls-secret
  namespace: traefik
spec:
  secretName: app-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - app.myomins.website

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-tls-secret
  namespace: traefik
spec:
  secretName: api-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - api.myomins.website
