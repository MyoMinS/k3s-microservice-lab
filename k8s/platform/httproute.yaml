apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  hostnames:
  - "app.myomins.website"
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: user-api
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: user-api
          port: 3000

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  hostnames:
  - "api.myomins.website"
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: panel-api
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: panel-api
          port: 3000