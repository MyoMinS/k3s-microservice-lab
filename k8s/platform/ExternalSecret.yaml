apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-external-secret
spec:
  refreshInterval: "1h" # May be set to "0s" to fetch and create it once. Defaults to 1h0m0s.
  secretStoreRef:
    name: aws-secretstore
    kind: ClusterSecretStore
  target:
    name: env-api
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: /my-app/prod/.env