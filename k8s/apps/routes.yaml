apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: animals
  namespace: demo
spec:
  hostnames:
  - "*"
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    # 1. Exact match for /dog
    - matches:
        - path:
            type: Exact
            value: /dog
      backendRefs:
        - name: dog
          port: 3000

    # 2. Exact matches for /cat and /cate
    - matches:
        - path:
            type: Exact
            value: /cat
        - path:
            type: Exact
            value: /cate
      backendRefs:
        - name: cat
          port: 3000

    # 3. Catch-all prefix for everything else (optional)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cat
          port: 3000