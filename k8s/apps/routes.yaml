apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: animals
  namespace: demo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: Exact
            value: /dog
      backendRefs:
        - name: dog
          port: 3000
    - matches:
        - path:
            type: Exact
            value: /cat
        - path:
            type: Exact
            value: /cate
      backendRefs:
        - name: cat
          port: 3000