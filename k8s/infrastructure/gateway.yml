apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
#  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  - name: panel-api
    protocol: HTTPS
    port: 443
    hostname: "api.myomins.website"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: panel-api-tls-secret
    allowedRoutes:
      namespaces:
        from: All
  - name: user-api
    protocol: HTTPS
    port: 443
    hostname: "app.myomins.website"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: user-api-tls-secret
    allowedRoutes:
      namespaces:
        from: All
