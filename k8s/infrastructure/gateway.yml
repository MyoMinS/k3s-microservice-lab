apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.myomins.website"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: app-tls-secret
      - kind: Secret
        name: api-tls-secret
    allowedRoutes:
      namespaces:
        from: All
