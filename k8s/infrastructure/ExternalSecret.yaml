apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-external-secret
  namespace: demo
spec:
  refreshInterval: "1h" # May be set to "0s" to fetch and create it once. Defaults to 1h0m0s.
  secretStoreRef:
    name: aws-secretstore
    kind: ClusterSecretStore
  target:
    name: my-secret      # The name of the native k3s secret that will be created
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: /my-app/prod/.env