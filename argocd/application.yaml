# Set spec.source.repoURL to the real public HTTPS repository before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: animals
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MyoMinS/k3s-microservice-lab.git
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true